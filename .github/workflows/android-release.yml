name: Publish Android APK

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(awk '/^version:/{print $2}' pubspec.yaml)"
          TAG="apk-${VERSION}-${GITHUB_RUN_NUMBER}"
          ASSET="flowpilot-${VERSION}-android.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$ASSET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "${{ steps.release.outputs.asset }}#FlowPilot Android APK" \
            --title "FlowPilot ${{ steps.release.outputs.version }}" \
            --generate-notes
